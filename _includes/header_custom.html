<style>
  .site-title {
    font-size: 1.2rem !important;
  }

  .global-theme-toggle {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 1000;
    width: 36px;
    height: 36px;
    border: 1px solid #d0d7de;
    border-radius: 999px;
    background: #ffffff;
    color: #24292f;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
  }

  .global-theme-toggle:hover {
    background: #f6f8fa;
  }

  .global-theme-toggle svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .global-theme-toggle.is-dark {
    background: #0d1117;
    color: #c9d1d9;
    border-color: #30363d;
  }
</style>

<button class="global-theme-toggle" id="global-theme-toggle" aria-label="Toggle theme" title="Toggle theme">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="5"></circle>
    <line x1="12" y1="1.5" x2="12" y2="4.5"></line>
    <line x1="12" y1="19.5" x2="12" y2="22.5"></line>
    <line x1="1.5" y1="12" x2="4.5" y2="12"></line>
    <line x1="19.5" y1="12" x2="22.5" y2="12"></line>
    <line x1="4.2" y1="4.2" x2="6.3" y2="6.3"></line>
    <line x1="17.7" y1="17.7" x2="19.8" y2="19.8"></line>
    <line x1="17.7" y1="6.3" x2="19.8" y2="4.2"></line>
    <line x1="4.2" y1="19.8" x2="6.3" y2="17.7"></line>
  </svg>
</button>

<script>
  (function() {
    var btn = document.getElementById('global-theme-toggle');
    if (!btn || !window.jtd || typeof jtd.getTheme !== 'function' || typeof jtd.setTheme !== 'function') return;

    function syncButton() {
      btn.classList.toggle('is-dark', jtd.getTheme() === 'dark');
    }

    syncButton();
    jtd.addEvent(btn, 'click', function() {
      var nextTheme = jtd.getTheme() === 'dark' ? 'light' : 'dark';
      jtd.setTheme(nextTheme);
      syncButton();
    });
  })();
</script>
